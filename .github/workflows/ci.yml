name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    # job 名与分支保护中登记的状态检查名一致，改名会导致 PR 卡在 BLOCKED
    name: 语法检查与单元测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 与 package.json 的 engines.node 保持一致
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 零运行时依赖，无 lockfile，无需 npm ci

      - run: npm test

      - run: npm run smoke
